name: "Experiment: exact Numba MT19937 pointer reuse original CPU and RNG"

on:
  push:
    branches: [experiment/numba-rng-pointer-reuse-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-numba-paired-cpu:
    name: 8-fit source-matched CPU and MT19937 state (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install true frozen master Numba and original Cython/native PCC package
        run: python -m pip install -e ".[numba]"
      - name: Validate source-exact private LLVM RNG intrinsics and original frozen CPU scripts
        run: >-
          python -m py_compile
          experiments/numba_rng_state_intrinsics.py
          experiments/audit_numba_rng_pointer.py
          experiments/summarize_numba_rng_pointer.py
      - name: 96 paired actual eight-fit CPU batches with original Numba MT19937 exact state
        run: python -m experiments.audit_numba_rng_pointer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numba-original-state-pointer-${{ matrix.os }}
          path: numba_rng_pointer_results.json
          if-no-files-found: warn

  strict-both-os-original-source:
    name: Strict 192 real native CPU batches, 3072 fit and 2-OS original RNG verdict
    needs: original-numba-paired-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: numba-original-state-pointer-*
          path: evidence
          merge-multiple: false
      - name: Complete every original full fit, state, RNG, branch, source, memory and CPU gate
        run: python -m experiments.summarize_numba_rng_pointer evidence
      - uses: actions/upload-artifact@v4
        with:
          name: numba-pointer-reuse-strict-native-scientific-decision
          path: |
            numba_rng_pointer_report.md
            numba_rng_pointer_decision.json
          if-no-files-found: error
