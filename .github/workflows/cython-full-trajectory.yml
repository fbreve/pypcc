name: Cython full trajectory counters
on:
  pull_request:
    paths:
      - pcc_step.pyx
      - benchmarks/full_trajectory_counters.py
      - .github/workflows/cython-full-trajectory.yml
  workflow_dispatch:
jobs:
  trace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy cython scipy scikit-learn setuptools wheel
      - run: python setup.py build_ext --inplace
      - run: python benchmarks/full_trajectory_counters.py
      - uses: actions/upload-artifact@v4
        with:
          name: full-trajectory-${{ matrix.os }}
          path: full-trajectory-counters.json
