name: Clean Cython cache exact numerical edge parity (Windows/Linux)

on:
  pull_request:
    paths:
      - pcc_step.pyx
      - experiments/audit_clean_cython_cache_numeric_edges.py
      - experiments/summarize_clean_cython_cache_numeric_edges.py
      - .github/workflows/clean-cython-cache-numeric-edges.yml
  workflow_dispatch:

jobs:
  stress-direct-cython:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile native Cython and install direct-test dependencies
        run: |
          python -m pip install "numpy>=2,<3" "Cython>=3.2,<4" scipy scikit-learn setuptools wheel
          python setup.py build_ext --inplace
          python -m pip freeze > clean-cache-stress-env-${{ matrix.os }}.txt
      - name: Stress all 3240 frozen numeric edge cases with per-check potential verification
        run: >-
          python -m experiments.audit_clean_cython_cache_numeric_edges
          --runner-os ${{ matrix.os }}
          --output clean-cache-numeric-${{ matrix.os }}.csv
      - name: Preserve complete OS-specific edge observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-cache-numeric-${{ matrix.os }}
          path: |
            clean-cache-numeric-${{ matrix.os }}.csv
            clean-cache-stress-env-${{ matrix.os }}.txt
          if-no-files-found: error

  require-complete-edge-cohort:
    needs: stress-direct-cython
    if: ${{ always() && needs.stress-direct-cython.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: clean-cache-numeric-*
          merge-multiple: true
          path: numeric-results
      - name: Reject any missing/duplicate/failed edge case on either OS
        run: >-
          python -m experiments.summarize_clean_cython_cache_numeric_edges
          --files numeric-results/clean-cache-numeric-*.csv
          --output clean-cache-numeric-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: clean-cache-numeric-summary
          path: clean-cache-numeric-report.md
          if-no-files-found: error
