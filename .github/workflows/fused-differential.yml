name: Fused kernel differential state check
on:
  pull_request:
    paths:
      - benchmarks/fused_differential.py
      - .github/workflows/fused-differential.yml
  workflow_dispatch:
jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy cython scipy scikit-learn setuptools wheel
      - run: python benchmarks/fused_differential.py
