name: Dominance full-fit layout experiment
on:
  pull_request:
    paths:
      - 'pcc.py'
      - 'benchmarks/benchmark_dominance_full_fit.py'
      - '.github/workflows/dominance-full-fit.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install numpy==2.2.6 Cython==3.0.12 setuptools==75.8.0 scipy scikit-learn numba
      - name: Build extension
        run: python setup.py build_ext --inplace
      - name: Compare complete fits
        run: |
          python benchmarks/benchmark_dominance_full_fit.py --nodes 256 --iterations 200 --repeats 5
          python benchmarks/benchmark_dominance_full_fit.py --nodes 1024 --iterations 400 --repeats 5
