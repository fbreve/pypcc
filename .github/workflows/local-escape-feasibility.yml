name: Experimental PCC local escape feasibility

on:
  pull_request:
    paths:
      - 'experiments/audit_local_escape_feasibility.py'
      - 'experiments/benchmark_inloop_global_stopping.py'
      - 'experiments/pcc_numpy_dominance_candidate.py'
      - '.github/workflows/local-escape-feasibility.yml'
  workflow_dispatch:

jobs:
  local-escape-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy scikit-learn numba
      - name: Analyze single-visit class-1 neighborhood acceptance
        run: |
          python -m experiments.audit_local_escape_feasibility \
            --output wine-local-escape-feasibility.csv \
            --seed 83 \
            --cap 50000 \
            --checkpoint-interval 100 \
            --delta-v 0.1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-escape-feasibility
          path: wine-local-escape-feasibility.csv
          if-no-files-found: error
