name: Cython distance saturation A/B
on:
  pull_request:
    paths:
      - 'pcc_step.pyx'
      - 'benchmarks/distance_saturation_ab.py'
      - '.github/workflows/cython-distance-saturation-ab.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy cython setuptools
      - run: python setup.py build_ext --inplace
      - run: python benchmarks/distance_saturation_ab.py > distance-saturation-results.jsonl
      - run: python -c "from pathlib import Path; print(next(x for x in Path('distance-saturation-results.jsonl').read_text().splitlines() if x.startswith('SUMMARY ')))"
      - uses: actions/upload-artifact@v4
        with:
          name: distance-saturation-${{ matrix.os }}
          path: distance-saturation-results.jsonl
