name: Cython counter overhead A/B
on:
  pull_request:
    paths:
      - 'pcc_step.pyx'
      - 'benchmarks/cython_counter_overhead_ab.py'
      - '.github/workflows/cython-counter-overhead-ab.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy cython setuptools
      - run: python setup.py build_ext --inplace
      - run: python benchmarks/cython_counter_overhead_ab.py > counter-overhead-results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: counter-overhead-${{ matrix.os }}
          path: counter-overhead-results.jsonl
