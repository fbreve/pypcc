name: Experimental NumPy scientific full-iteration trajectory pilot

on:
  pull_request:
    paths:
      - experiments/numpy_trajectory_dynamics_protocol.md
      - experiments/audit_numpy_trajectory_dynamics.py
      - experiments/summarize_numpy_trajectory_dynamics.py
      - tests/test_numpy_trajectory_dynamics.py
      - .github/workflows/numpy-trajectory-dynamics.yml
  workflow_dispatch:

jobs:
  real-trajectory:
    strategy:
      fail-fast: false
      matrix:
        dataset: [iris, wine, breast_cancer, digits]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current native PCC
        run: |
          python -m pip install -e ".[numba]"
          python -m pip freeze > trajectory-env-${{ matrix.dataset }}.txt
      - name: Validate synthetic every-step and window counter semantics
        run: python -m unittest -v tests.test_numpy_trajectory_dynamics
      - name: Execute real uninterrupted seeded 6001-step trajectories
        run: >-
          python -m experiments.audit_numpy_trajectory_dynamics
          --dataset ${{ matrix.dataset }}
          --output trajectory-${{ matrix.dataset }}.json
      - name: Archive each preregistered case and complete window time series
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-${{ matrix.dataset }}
          path: |
            trajectory-${{ matrix.dataset }}.json
            trajectory-env-${{ matrix.dataset }}.txt
          if-no-files-found: warn

  require-all-real-traces:
    needs: real-trajectory
    if: ${{ always() && needs.real-trajectory.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: trajectory-*
          merge-multiple: true
          path: trajectory-data
      - name: Enforce 8/8 strict scientific trajectory triples
        run: >-
          python -m experiments.summarize_numpy_trajectory_dynamics
          --files trajectory-data/trajectory-*.json
          --output trajectory-scientific-pilot-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: trajectory-scientific-pilot-complete-report
          path: trajectory-scientific-pilot-report.md
          if-no-files-found: error
