name: Cython movement decision trace
on:
  pull_request:
    paths:
      - benchmarks/movement_counters.py
      - benchmarks/graph_topology.py
      - .github/workflows/cython-movement-trace.yml
  workflow_dispatch:
jobs:
  trace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy cython scipy scikit-learn setuptools wheel
      - run: python setup.py build_ext --inplace
      - run: python benchmarks/movement_counters.py
      - uses: actions/upload-artifact@v4
        with:
          name: movement-counters-${{ matrix.os }}
          path: movement-counters-result.json
