name: Experimental PCC particle lockout rescue

on:
  pull_request:
    paths:
      - 'experiments/audit_lockout_rescue_interventions.py'
      - 'experiments/benchmark_inloop_global_stopping.py'
      - 'experiments/pcc_numpy_dominance_candidate.py'
      - '.github/workflows/particle-lockout-rescue.yml'
  workflow_dispatch:

jobs:
  particle-lockout-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy scikit-learn numba
      - name: Compare strength-only, relocation-only and combined interventions
        run: |
          python -m experiments.audit_lockout_rescue_interventions \
            --trace-output wine-lockout-rescue-trace.csv \
            --summary-output wine-lockout-rescue-summary.csv \
            --seed 83 \
            --cap 60000 \
            --interval 1000 \
            --intervention-iteration 48000
      - name: Upload counterfactual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: particle-lockout-rescue
          path: |
            wine-lockout-rescue-trace.csv
            wine-lockout-rescue-summary.csv
          if-no-files-found: error
