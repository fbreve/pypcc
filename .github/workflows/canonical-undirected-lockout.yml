name: Experimental PCC canonical undirected lockout

on:
  pull_request:
    paths:
      - 'experiments/audit_canonical_undirected_lockout.py'
      - '.github/workflows/canonical-undirected-lockout.yml'
  workflow_dispatch:

jobs:
  canonical-undirected:
    strategy:
      fail-fast: false
      matrix:
        dataset: [iris, wine, breast_cancer, digits]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy scikit-learn numba
      - name: Audit lockout on actual production symmetric kNN graph
        run: |
          python -m experiments.audit_canonical_undirected_lockout \
            --dataset ${{ matrix.dataset }} \
            --seeds 1709 1801 1901 2003 2111 \
            --windows-output canonical-windows-${{ matrix.dataset }}.csv \
            --classes-output canonical-classes-${{ matrix.dataset }}.csv \
            --cases-output canonical-cases-${{ matrix.dataset }}.csv \
            --cap 50000 \
            --interval 1000 \
            --lockout-windows 5 \
            --strength-cutoff 0.01
      - name: Upload canonical experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-undirected-lockout-${{ matrix.dataset }}
          path: |
            canonical-windows-${{ matrix.dataset }}.csv
            canonical-classes-${{ matrix.dataset }}.csv
            canonical-cases-${{ matrix.dataset }}.csv
          if-no-files-found: error
