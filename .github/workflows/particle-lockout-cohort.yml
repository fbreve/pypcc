name: Experimental PCC preregistered lockout cohort

on:
  pull_request:
    paths:
      - 'experiments/audit_lockout_predefined_cohort.py'
      - '.github/workflows/particle-lockout-cohort.yml'
  workflow_dispatch:

jobs:
  lockout-cohort:
    strategy:
      fail-fast: false
      matrix:
        dataset: [iris, wine, breast_cancer, digits]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy scikit-learn numba
      - name: Evaluate predefined class-particle lockout event
        run: |
          python -m experiments.audit_lockout_predefined_cohort \
            --windows-output lockout-windows-${{ matrix.dataset }}.csv \
            --summary-output lockout-summary-${{ matrix.dataset }}.csv \
            --cases-output lockout-cases-${{ matrix.dataset }}.csv \
            --datasets ${{ matrix.dataset }} \
            --seeds 101 211 307 401 503 \
            --cap 50000 \
            --interval 1000 \
            --lockout-windows 5 \
            --strength-cutoff 0.01
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockout-cohort-${{ matrix.dataset }}
          path: |
            lockout-windows-${{ matrix.dataset }}.csv
            lockout-summary-${{ matrix.dataset }}.csv
            lockout-cases-${{ matrix.dataset }}.csv
          if-no-files-found: error
