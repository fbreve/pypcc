name: Cython kernel scaling benchmark
on:
  pull_request:
    paths:
      - benchmarks/kernel_scaling.py
      - .github/workflows/kernel-scaling.yml
  workflow_dispatch:
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy cython scipy scikit-learn setuptools wheel
      - run: python setup.py build_ext --inplace
      - run: python benchmarks/kernel_scaling.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-scaling-${{ matrix.os }}
          path: kernel-scaling-result.json
          if-no-files-found: warn
