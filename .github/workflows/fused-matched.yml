name: Fused kernel matched comparison
on:
  pull_request:
    paths:
      - benchmarks/fused_matched.py
      - .github/workflows/fused-matched.yml
  workflow_dispatch:
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy cython scipy scikit-learn setuptools wheel
      - run: python benchmarks/fused_matched.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fused-matched-${{ matrix.os }}
          path: fused-matched-result.json
          if-no-files-found: warn
