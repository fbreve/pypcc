name: Experimental NumPy observer isolated-wheel contract

on:
  pull_request:
    paths:
      - pcc_numpy.py
      - pcc.py
      - setup.py
      - pyproject.toml
      - MANIFEST.in
      - tools/check_numpy_observer_wheel_contract.py
      - experiments/summarize_numpy_observer_wheel_contract.py
      - experiments/numpy_continuous_phase5_protocol.md
      - .github/workflows/numpy-observer-wheel-contract.yml
  workflow_dispatch:

jobs:
  installed-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package builder
        run: python -m pip install build
      - name: Isolated build of source distribution
        run: python -m build --sdist --outdir dist
      - name: Build wheel from the source distribution
        run: >-
          python -c "import glob, subprocess, sys;
          sources=glob.glob('dist/*.tar.gz');
          assert len(sources)==1, sources;
          subprocess.check_call([sys.executable,'-m','pip','wheel','--no-deps',sources[0],'--wheel-dir','dist'])"
      - name: Install wheel and runtime requirements (non-editable)
        run: >-
          python -c "import glob, subprocess, sys;
          wheels=glob.glob('dist/*.whl');
          assert len(wheels)==1, wheels;
          subprocess.check_call([sys.executable,'-m','pip','install',wheels[0]])"
      - name: Preserve runtime dependency inventory
        run: python -m pip freeze > numpy-wheel-env-${{ matrix.os }}-py${{ matrix.python-version }}.txt
      - name: Isolated Python verifier completely outside source checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -I "${{ github.workspace }}/tools/check_numpy_observer_wheel_contract.py"
          --checkout "${{ github.workspace }}"
          --output "${{ github.workspace }}/numpy-wheel-${{ matrix.os }}-py${{ matrix.python-version }}.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numpy-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            numpy-wheel-${{ matrix.os }}-py${{ matrix.python-version }}.json
            numpy-wheel-env-${{ matrix.os }}-py${{ matrix.python-version }}.txt
          if-no-files-found: warn

  require-all-wheel-contracts:
    needs: installed-wheel
    if: ${{ always() && needs.installed-wheel.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: numpy-wheel-*
          merge-multiple: true
          path: wheel-contract-data
      - name: Require all 4 OS/Python reports and 13 strict checks each
        run: >-
          python -m experiments.summarize_numpy_observer_wheel_contract
          --files wheel-contract-data/numpy-wheel-*.json
          --output numpy-wheel-phase5-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: numpy-wheel-phase5-complete-report
          path: numpy-wheel-phase5-report.md
          if-no-files-found: error
