name: Cython native instruction profile
on:
  pull_request:
  workflow_dispatch:
jobs:
  callgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build dependencies and profiler
        run: |
          python -m pip install numpy==2.2.6 Cython==3.0.12 setuptools==75.8.0
          sudo timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo timeout 360s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends valgrind
      - name: Compile with native debug symbols
        env:
          CFLAGS: -g -O2 -fno-omit-frame-pointer
        run: python setup.py build_ext --inplace
      - name: Collect instruction profile in Cython kernel
        run: |
          set -o pipefail
          PCC_CALLGRIND_ISOLATE=1 valgrind --tool=callgrind --instr-atstart=no --collect-atstart=yes --callgrind-out-file=callgrind.out python benchmarks/profile_cython_kernel.py 2>&1 | tee callgrind-run.log
          python -c "from pathlib import Path; import re; log=Path('callgrind-run.log').read_text(); counts=re.findall('Collected *: *([0-9]+)', log); assert counts and int(counts[-1])>0, 'Empty instruction profile'; print('COLLECTED_INSTRUCTIONS', counts[-1])"
          # Callgrind can write summary: 0 when instrumentation is stopped before exit.
          # Normalize the annotation copy using its recorded totals, preserving the raw profile.
          python -c "from pathlib import Path; p=Path('callgrind.out'); t=p.read_text(); totals=[x.split(':',1)[1].strip() for x in t.splitlines() if x.startswith('totals:')]; assert len(totals)==1 and int(totals[0])>0; assert 'summary: 0' in t; Path('callgrind-annotate.out').write_text(t.replace('summary: 0', 'summary: '+totals[0], 1))"
          callgrind_annotate --inclusive=yes --threshold=0 callgrind-annotate.out > callgrind-report.txt
          head -n 120 callgrind-report.txt
          python benchmarks/summarize_callgrind.py callgrind-annotate.out > callgrind-functions.txt
          head -n 65 callgrind-functions.txt
          # Annotate generated C source; debug line information comes from the native build.
          callgrind_annotate --inclusive=no --threshold=0 callgrind-annotate.out pcc_step.c > callgrind-source.txt
          python -c "from pathlib import Path; t=Path('callgrind-source.txt').read_text(); assert 'pcc_step.c' in t and '__pyx_f_8pcc_step_pcc_propagate' in t, 'Missing Cython kernel source attribution'; print('SOURCE_ANNOTATION_BYTES', len(t))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cython-callgrind-profile
          path: |
            callgrind.out
            callgrind-annotate.out
            callgrind-report.txt
            callgrind-functions.txt
            callgrind-run.log
            callgrind-source.txt
