name: Experimental cross-dataset undirected bridge generalization

on:
  pull_request:
    paths:
      - experiments/numpy_crossdataset_bridge_protocol.md
      - experiments/audit_numpy_crossdataset_bridges.py
      - experiments/summarize_numpy_crossdataset_bridges.py
      - tests/test_numpy_crossdataset_bridges.py
      - .github/workflows/numpy-crossdataset-bridge-generalization.yml
  workflow_dispatch:

jobs:
  dataset-seed-native-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        dataset: [wine, breast_cancer]
        seed: [23111, 23209, 23321, 23417]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real native PCC and record current packages
        run: |
          python -m pip install -e ".[numba]"
          python -m pip freeze > deps-${{ matrix.dataset }}-${{ matrix.seed }}.txt
      - name: Verify graph nesting, supervision and inherited true-crossing tests
        run: >-
          python -m unittest -v
          tests.test_numpy_crossdataset_bridges
          tests.test_numpy_undirected_multibridge
      - name: Run all five fixed graphs as fresh 100k native pairs
        run: >-
          python -m experiments.audit_numpy_crossdataset_bridges
          --dataset ${{ matrix.dataset }}
          --seed ${{ matrix.seed }}
          --output results-${{ matrix.dataset }}-${{ matrix.seed }}.json
      - name: Preserve completed cases, full streaming windows and dependency versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossdataset-${{ matrix.dataset }}-${{ matrix.seed }}
          path: |
            results-${{ matrix.dataset }}-${{ matrix.seed }}.json
            deps-${{ matrix.dataset }}-${{ matrix.seed }}.txt
          if-no-files-found: warn

  mandatory-all-forty:
    needs: dataset-seed-native-pairs
    if: ${{ always() && needs.dataset-seed-native-pairs.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: crossdataset-*
          merge-multiple: true
          path: all-dataset-results
      - name: Reject any missing, repeated or non-parity native condition
        run: >-
          python -m experiments.summarize_numpy_crossdataset_bridges
          --files all-dataset-results/results-*.json
          --output undirected-bridge-crossdataset-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: undirected-bridge-crossdataset-report
          path: undirected-bridge-crossdataset-report.md
          if-no-files-found: error
