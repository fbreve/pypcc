name: Research P2-07C consolidated resource envelope DRY RUN — no datasets, graphs, masks, PCC

on:
  pull_request:
    paths:
      - 'experiments/p2_07c_consolidated_execution_envelope_no_fit.py'
      - 'experiments/test_p2_07c_consolidated_execution_envelope_no_fit.py'
      - 'docs/current_p2_07c_candidate_operational_envelope_2026-11-13.json'
      - 'docs/current_p2_07c_resource_and_export_review_2026-11-13.md'
      - '.github/workflows/research-p2-07c-resource-envelope-dry-run-no-pcc.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  synthetic-metadata-policy-tests:
    name: P2-07C no-PCC policy/false-GO tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stdlib-only tests for frozen scientific SHA, case-order, proposed budgets and refusal of false GO
        shell: bash
        run: |
          python -m unittest experiments.test_p2_07c_consolidated_execution_envelope_no_fit -v
      - name: Reject any executable PCC/real-data access in this stage and require immutable P1
        shell: bash
        run: |
          python -c "from experiments import p2_07c_consolidated_execution_envelope_no_fit as x; p=x.read_approved_P1(); c=x.load(x.POLICY); x.validate_policy(c,p); assert len(x.case_order(p))==72; assert not c['P2_execution_authorized']; print('PASS: P2-07C no-fit dry-run contract, false GO preserved')"

  validate-historical-evidence-and-admission:
    name: Source-bound P2-07C proposed 72-case envelope (all 6 archived reports, no PCC)
    runs-on: ubuntu-latest
    needs: synthetic-metadata-policy-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain exact already passed Linux P2-07A metadata-only array budget
        uses: actions/download-artifact@v4
        with:
          name: p2-07-metadata-only-snapshot-budget-ubuntu-latest-py312
          path: p2-07c-evidence/p2-07-metadata-only-snapshot-budget-ubuntu-latest-py312
          run-id: 43478839756
          repository: fbreve/pypcc
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Obtain exact already passed Windows P2-07A metadata-only array budget
        uses: actions/download-artifact@v4
        with:
          name: p2-07-metadata-only-snapshot-budget-windows-latest-py312
          path: p2-07c-evidence/p2-07-metadata-only-snapshot-budget-windows-latest-py312
          run-id: 43478839756
          repository: fbreve/pypcc
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Obtain original synthetic CPU/whole-process peak RAM pilot — Linux
        uses: actions/download-artifact@v4
        with:
          name: p2-07b-synthetic-three-backend-cpu-memory-ubuntu-latest-py312
          path: p2-07c-evidence/p2-07b-synthetic-three-backend-cpu-memory-ubuntu-latest-py312
          run-id: 43483012485
          repository: fbreve/pypcc
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Obtain original synthetic CPU/whole-process peak RAM pilot — Windows
        uses: actions/download-artifact@v4
        with:
          name: p2-07b-synthetic-three-backend-cpu-memory-windows-latest-py312
          path: p2-07c-evidence/p2-07b-synthetic-three-backend-cpu-memory-windows-latest-py312
          run-id: 43483012485
          repository: fbreve/pypcc
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Obtain original NEW P2-01F Linux compiler/build ledger and byte-sealed native candidate
        uses: actions/download-artifact@v4
        with:
          name: p2-01f-PROSPECTIVE-new-native-toolchain-ubuntu-latest-py312-run43488066633
          path: p2-07c-evidence/p2-01f-PROSPECTIVE-new-native-toolchain-ubuntu-latest-py312-run43488066633
          run-id: 43488066633
          repository: fbreve/pypcc
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Obtain original NEW P2-01F Windows compiler/build ledger and byte-sealed native candidate
        uses: actions/download-artifact@v4
        with:
          name: p2-01f-PROSPECTIVE-new-native-toolchain-windows-latest-py312-run43488066633
          path: p2-07c-evidence/p2-01f-PROSPECTIVE-new-native-toolchain-windows-latest-py312-run43488066633
          run-id: 43488066633
          repository: fbreve/pypcc
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Independently hash BOTH archived native binaries per OS, check 13 wheel versions, prior budgets and synthetic pilot
        shell: bash
        run: |
          python -m experiments.p2_07c_consolidated_execution_envelope_no_fit \
            --evidence-root p2-07c-evidence \
            --output p2-07c-proposed-execution-envelope-no-fit.json
      - name: Fail closed on false measured real resource GO or implied P2 authorization
        shell: bash
        run: |
          python -c "import json; d=json.load(open('p2-07c-proposed-execution-envelope-no-fit.json')); p=d['candidate_guardrails_not_approved']; assert d['status']=='CANDIDATE_GUARDRAILS_CONSISTENT_BUT_NO_ACTUAL_50K_RESOURCE_GO'; assert d['case_schedule']['count']==72; assert d['candidate_ram_headroom_multiplier_vs_max_SYNTHETIC_only']>=4; assert p['max_one_fit_peak_process_resident_bytes']==2*1024**3; assert d['candidate_72_fit_nominal_cap_seconds_excluding_overhead']==129600; assert d['candidate_full_study_wall_cap_seconds']==172800; assert d['candidate_72_aggregate_plus_log_cap_bytes']<=1024**3; assert d['P2_07A_source_array_accounting']['max_hypothetical_array_payload_bytes']==650012; assert d['P2_07A_source_array_accounting']['all_72_snapshot_array_bytes']==14079360; assert not d['approved_execution_host_selected'] and not d['actual_P2_07_resource_gate_pass']; assert not d['candidate_per_fit_time_measured_on_real_50k_UCI_data']; assert not d['candidate_real_PCC_process_RSS_peak_or_disk_measured']; assert not d['native_compiler_SDK_runtime_OS_complete_byte_lock_proved']; assert d['P2_execution_preflight_sha256'] is None and not d['P2_execution_authorized']; assert d['real_dataset_downloads_or_rows_loaded_in_this_stage']==0 and d['graph_or_label_masks_constructed_in_this_stage']==0 and d['synthetic_or_real_PCC_propagations_executed_in_this_stage']==0 and d['real_PCC_fits_executed']==0"
      - name: Archive only candidate guardrails and SAFE historic provenance; never copy old native binaries or data records
        uses: actions/upload-artifact@v4
        with:
          name: p2-07c-candidate-resource-admission-dry-run-no-PCC
          path: p2-07c-proposed-execution-envelope-no-fit.json
          retention-days: 30
          if-no-files-found: error
