name: PCC regression
on:
  push:
    branches: [fix/numpy-propagation-correctness]
  pull_request:
  workflow_dispatch:
    inputs:
      extended_seeds:
        description: 'Number of seeds for the optional extended backend comparison (0 disables it)'
        required: false
        default: '30'
        type: string

jobs:
  numpy-regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies and compiled backends
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy scipy scikit-learn numba cython
          python -m pip install --no-build-isolation -e .
      - name: Compile changed modules
        run: python -m py_compile pcc_numpy.py pcc.py test_numpy_regression.py
      - name: Run regression tests
        run: python -m unittest -v test_numpy_regression
      - name: Run NumPy microbenchmarks
        run: python benchmark_numpy_modes.py
      - name: Compare Wine classification modes
        run: python benchmark_wine_modes.py
      - name: Compare Digits classification modes
        run: python benchmark_digits_modes.py
      - name: Compare compiled and NumPy backends
        run: python benchmark_backends.py

      - name: Extended paired backend comparison
        if: github.event_name == 'workflow_dispatch' && inputs.extended_seeds != '0' && matrix.python-version == '3.12'
        run: python benchmark_backends.py --seeds "${{ inputs.extended_seeds }}" --iterations 1000

      - name: Diagnose dominance decision gaps (temporary)
        if: matrix.python-version == '3.12'
        run: |
          python benchmark_backends.py --diagnose-digits 0 --iterations 1000
          python benchmark_backends.py --diagnose-digits 8 --iterations 1000
