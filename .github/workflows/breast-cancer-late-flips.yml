name: Experimental PCC Breast Cancer late flip resolution

on:
  pull_request:
    paths:
      - 'experiments/analyze_late_flip_sequences.py'
      - 'experiments/analyze_late_prediction_changes.py'
      - '.github/workflows/breast-cancer-late-flips.yml'
  workflow_dispatch:

jobs:
  breast-cancer-flips:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy scikit-learn numba
      - name: Sample Breast Cancer labels every 1000 iterations
        run: |
          python -m experiments.analyze_late_flip_sequences \
            --output breast-cancer-late-flips-1k.csv \
            --datasets breast_cancer \
            --seeds 11 23 37 41 53 \
            --caps 40000 41000 42000 43000 44000 45000 46000 47000 48000 49000 50000
      - name: Upload fine-grained sequence metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breast-cancer-late-flips-1k
          path: breast-cancer-late-flips-1k.csv
          if-no-files-found: error
