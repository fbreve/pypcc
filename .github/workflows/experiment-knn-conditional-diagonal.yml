name: Experimental kNN diagonal cleanup exact CPU and state audit

on:
  push:
    branches: [experiment/knn-conditional-diagonal-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-original-vs-candidate:
    name: Frozen source kNN diagonal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build/install actual NumPy Numba Cython PCC native backends
        run: python -m pip install -e ".[numba]"
      - name: Require true native source backends
        run: python -c "import pcc_step,pcc_numba,pcc_numpy; print('PCC backends available')"
      - name: Exact graph and tied neighbor permanent tests
        run: python -m unittest -v tests.test_knn_conditional_diagonal
      - name: Run prospectively fixed CPU, memory and original six-state experiments
        run: python experiments/audit_knn_conditional_diagonal.py
      - uses: actions/upload-artifact@v4
        with:
          name: knn-diagonal-${{ matrix.os }}
          path: knn_diagonal_result.json
          if-no-files-found: error

  strict-both-os-verdict:
    name: Complete original-vs-candidate scientific graph decision
    runs-on: ubuntu-latest
    needs: frozen-original-vs-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: knn-diagonal-*
          path: inputs
          merge-multiple: false
      - name: Enforce complete 1050 source pairs and 96 native fits
        run: python experiments/summarize_knn_conditional_diagonal.py inputs
      - uses: actions/upload-artifact@v4
        with:
          name: knn-diagonal-scientific-verdict
          path: |
            knn_diagonal_decision.json
            knn_diagonal_report.md
          if-no-files-found: error
