name: Experimental exact graph phase and public install profile

on:
  push:
    branches: [experiment/graph-phase-set-graph-post207-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-graph:
    name: Pinned graph stages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual original native library and all backends
        run: python -m pip install -e ".[numba]"
      - name: Check native extension, Numba and NumPy
        run: python -c "import pcc_step,pcc_numba,pcc_numpy; print('Original native backends imported')"
      - name: Audit source-stamped exact graph stages and install public APIs
        run: python experiments/profile_graph_stage_installation.py
      - uses: actions/upload-artifact@v4
        with:
          name: graph-phase-${{ matrix.os }}
          path: graph_phase_result.json
          if-no-files-found: error

  strict-two-host-aggregate:
    name: Complete exact source and stage fidelity across OS
    runs-on: ubuntu-latest
    needs: original-source-graph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: graph-phase-*
          path: input
          merge-multiple: false
      - name: Verify entire raw measured corpus and publish phase attribution
        run: python experiments/summarize_graph_stage_installation.py input
      - uses: actions/upload-artifact@v4
        with:
          name: graph-phase-audit-report
          path: graph_phase_report.md
          if-no-files-found: error
