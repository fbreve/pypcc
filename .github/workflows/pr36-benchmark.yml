name: Cython finite threshold sweep
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pr36-benchmark.yml'
      - 'benchmarks/pr36_compare.py'
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'numpy>=2,<3' 'Cython>=3.2,<4' scipy scikit-learn setuptools wheel
      - name: Compare revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bench-results"
          cp benchmarks/pr36_compare.py "$RUNNER_TEMP/pr36_compare.py"
          for threshold in 1024 4096 16384; do
            git checkout --detach 10313ab01207d04ccf3b556bd7701d941b87c020
            sed -i "s/values.shape\[0\] \* values.shape\[1\] >= 4096/values.shape[0] * values.shape[1] >= $threshold/" pcc_step.pyx
            ref="threshold-$threshold"
            python setup.py build_ext --inplace
            BENCH_REF="$ref" PYTHONPATH="$PWD" python "$RUNNER_TEMP/pr36_compare.py" > "$RUNNER_TEMP/bench-results/$ref.log"
            cp benchmark-result.json "$RUNNER_TEMP/bench-results/$ref.json"
            rm -f pcc_step*.so
          done
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'bench-results'
          files=sorted(root.glob('*.json'))
          by_name={p.stem:json.loads(p.read_text()) for p in files}
          refs=['threshold-1024','threshold-4096','threshold-16384']
          if not all(r in by_name for r in refs):
              raise RuntimeError('Missing threshold results')
          rows=[by_name[r]['results'] for r in refs]
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('| Scenario | 1024 (ms) | 4096 (ms) | 16384 (ms) |\\n|---|---:|---:|---:|\\n')
              for trio in zip(*rows):
                  if len({(v['entry'],v['n']) for v in trio}) != 1:
                      raise RuntimeError('Benchmark scenarios do not match')
                  f.write(f"| {trio[0]['entry']} n={trio[0]['n']} | "+' | '.join(f"{v['median_ms']:.3f}" for v in trio)+" |\\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cython-threshold-sweep-results
          path: ${{ runner.temp }}/bench-results/
