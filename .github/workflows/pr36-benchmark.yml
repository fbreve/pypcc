name: Cython finite preflight three-way comparison
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pr36-benchmark.yml'
      - 'benchmarks/pr36_compare.py'
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'numpy>=2,<3' 'Cython>=3.2,<4' scipy scikit-learn setuptools wheel
      - name: Compare revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bench-results"
          cp benchmarks/pr36_compare.py "$RUNNER_TEMP/pr36_compare.py"
          for ref in 1c2fcc6e84596c1334d6ba4b6b2aac945b75c73b 525fce75d8b475704fcccf6d667d4ae703ae253a 10313ab01207d04ccf3b556bd7701d941b87c020; do
            git checkout --detach "$ref"
            python setup.py build_ext --inplace
            BENCH_REF="$ref" PYTHONPATH="$PWD" python "$RUNNER_TEMP/pr36_compare.py" > "$RUNNER_TEMP/bench-results/$ref.log"
            cp benchmark-result.json "$RUNNER_TEMP/bench-results/$ref.json"
            rm -f pcc_step*.so
          done
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'bench-results'
          files=sorted(root.glob('*.json'))
          by_sha={p.stem:json.loads(p.read_text()) for p in files}
          refs=['1c2fcc6e84596c1334d6ba4b6b2aac945b75c73b','525fce75d8b475704fcccf6d667d4ae703ae253a','10313ab01207d04ccf3b556bd7701d941b87c020']
          if not all(r in by_sha for r in refs):
              raise RuntimeError('Missing benchmark results for one or more revisions')
          base, native, hybrid=[by_sha[r] for r in refs]
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('| Scenario | PR36 (ms) | PR38 native (ms) | PR39 hybrid (ms) | Hybrid vs PR36 | Hybrid vs PR38 |\\n|---|---:|---:|---:|---:|---:|\\n')
              for a,b,c in zip(base['results'],native['results'],hybrid['results']):
                  if (a['entry'],a['n']) != (b['entry'],b['n']) or (a['entry'],a['n']) != (c['entry'],c['n']):
                      raise RuntimeError('Benchmark scenarios do not match')
                  d1=(c['median_ms']/a['median_ms']-1)*100
                  d2=(c['median_ms']/b['median_ms']-1)*100
                  f.write(f"| {a['entry']} n={a['n']} | {a['median_ms']:.3f} | {b['median_ms']:.3f} | {c['median_ms']:.3f} | {d1:+.2f}% | {d2:+.2f}% |\\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cython-hybrid-three-way-results
          path: ${{ runner.temp }}/bench-results/
