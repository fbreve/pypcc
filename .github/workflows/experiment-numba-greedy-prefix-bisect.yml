name: "Experiment: exact original Numba greedy prefix binary search full CPU A/B"

on:
  push:
    branches: [experiment/numba-greedy-prefix-bisect-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-native:
    name: "True original Numba vs prefix bisect 84-cohort CPU (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original real Numba and Cython PCC package
        run: python -m pip install -e ".[numba]"
      - name: Verify source experiment syntax
        run: >-
          python -m py_compile
          experiments/audit_numba_prefix_bisect.py
          experiments/summarize_numba_prefix_bisect.py
      - name: Verify true source native, 1500 prefix plateau/boundary controls, Digits smoke
        run: >-
          python -m experiments.audit_numba_prefix_bisect
          --smoke --output .cache/numba-prefix-bisect-smoke.json
      - name: Frozen 84-cohort CPU/wall, real Numba states, RNG, stopping and memory campaign
        run: >-
          python -m experiments.audit_numba_prefix_bisect
          --output .cache/numba-prefix-bisect-native-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numba-prefix-bisect-native-raw-${{ matrix.os }}
          path: .cache/numba-prefix-bisect-native-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 90

  strict-both-hosts:
    name: "Strict 2-OS original 84-cohort CPU GO gate / source state and RNG"
    needs: original-native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: numba-prefix-bisect-native-raw-*
          path: .cache/numba-prefix-bisect-original-hosts
          merge-multiple: false
      - name: Verify exact source/states/RNG, nonregression and frozen paired CPU thresholds
        run: >-
          python -m experiments.summarize_numba_prefix_bisect
          .cache/numba-prefix-bisect-original-hosts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numba-prefix-bisect-frozen-two-host-scientific-decision
          path: |
            numba_prefix_bisect_report.md
            numba_prefix_bisect_decision.json
          if-no-files-found: error
          retention-days: 90
