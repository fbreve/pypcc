name: "Experiment: original Numba greedy-weight zero/saturation composition"

on:
  push:
    branches: [experiment/numba-greedy-weight-composition-v1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  actual-numba:
    name: "Original vs 41-weight-counter native Numba exact state/RNG (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual original Numba and native Cython
        run: python -m pip install -e ".[numba]"
      - name: Compile both scientific scripts, do not edit production
        run: >-
          python -m py_compile
          experiments/audit_numba_weight_composition.py
          experiments/summarize_numba_weight_composition.py
      - name: Require original full-row Numba argmax, 0/5 steps and Digits smoke exactness
        run: >-
          python -m experiments.audit_numba_path_counters
          --smoke --output .cache/numba-weight-composition-smoke.json
      - name: Run 162 frozen original/counted greedy weight/zero/distance cohorts
        run: >-
          python -m experiments.audit_numba_path_counters
          --output .cache/numba-weight-composition-native-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numba-weight-composition-native-raw-${{ matrix.os }}
          path: .cache/numba-weight-composition-native-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 90

  strict-immutable-original-audit:
    name: "Two-host 162 41-counter cohorts and original #232 frozen replay"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: actual-numba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download original and science sidecar evidence from this run
        uses: actions/download-artifact@v4
        with:
          pattern: numba-weight-composition-native-raw-*
          path: .cache/numba-weight-composition-two-os/native
          merge-multiple: false
      - name: Download original #232 21-counter immutable source data for exact per-path replay
        uses: actions/download-artifact@v4
        with:
          repository: fbreve/pypcc
          run-id: 42703206929
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: numba-path-counts-native-raw-*
          path: .cache/numba-weight-composition-two-os/prior-232
          merge-multiple: false
      - name: Require all 41 event fields, state/RNG and exact frozen #232 162-case replay
        run: >-
          python -m experiments.summarize_numba_path_counters
          .cache/numba-weight-composition-two-os
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numba-greedy-weight-composition-strict-report
          path: |
            numba_weight_composition_report.md
            numba_weight_composition_decision.json
          if-no-files-found: error
          retention-days: 90
