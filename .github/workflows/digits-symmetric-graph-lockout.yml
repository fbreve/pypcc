name: Experimental PCC Digits symmetric graph lockout

on:
  pull_request:
    paths:
      - 'experiments/audit_digits_symmetric_graph_lockout.py'
      - '.github/workflows/digits-symmetric-graph-lockout.yml'
  workflow_dispatch:

jobs:
  paired-symmetric-graph:
    strategy:
      fail-fast: false
      matrix:
        seed: [907, 1009, 1103, 1201]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy scikit-learn numba
      - name: Compare directed and union-symmetric graph in fixed cohort
        run: |
          python -m experiments.audit_digits_symmetric_graph_lockout \
            --seed ${{ matrix.seed }} \
            --graph-output symmetric-graph-${{ matrix.seed }}.csv \
            --windows-output symmetric-windows-${{ matrix.seed }}.csv \
            --classes-output symmetric-classes-${{ matrix.seed }}.csv \
            --cases-output symmetric-cases-${{ matrix.seed }}.csv \
            --cap 50000 \
            --interval 1000 \
            --zero-windows 5 \
            --strength-cutoff 0.01
      - name: Upload per-seed experiment data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symmetric-graph-lockout-${{ matrix.seed }}
          path: |
            symmetric-graph-${{ matrix.seed }}.csv
            symmetric-windows-${{ matrix.seed }}.csv
            symmetric-classes-${{ matrix.seed }}.csv
            symmetric-cases-${{ matrix.seed }}.csv
          if-no-files-found: error
