name: Experimental PCC held-out P10 vs potential (48 cases)

on:
  pull_request:
    paths:
      - 'experiments/audit_heldout_p10_vs_potential.py'
      - 'experiments/summarize_heldout_p10_vs_potential.py'
      - 'experiments/heldout_p10_vs_potential_protocol.md'
      - '.github/workflows/heldout-p10-vs-potential.yml'
  workflow_dispatch:

jobs:
  canonical-heldout:
    strategy:
      fail-fast: false
      matrix:
        dataset: [iris, wine, breast_cancer, digits]
        labels_per_class: [2, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install experimental dependencies
        run: |
          python -m pip install -e ".[numba]"
          python -m pip freeze > versions-${{ matrix.dataset }}-${{ matrix.labels_per_class }}.txt
      - name: Reproduce fixed held-out 200k PCC comparisons
        run: |
          python -m experiments.audit_heldout_p10_vs_potential \
            --dataset ${{ matrix.dataset }} \
            --labeled-per-class ${{ matrix.labels_per_class }} \
            --output heldout-pcc-${{ matrix.dataset }}-${{ matrix.labels_per_class }}.csv
      - name: Upload all raw observations and dependency versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heldout-pcc-${{ matrix.dataset }}-${{ matrix.labels_per_class }}
          path: |
            heldout-pcc-${{ matrix.dataset }}-${{ matrix.labels_per_class }}.csv
            versions-${{ matrix.dataset }}-${{ matrix.labels_per_class }}.txt
          if-no-files-found: error

  summarize-heldout:
    needs: canonical-heldout
    if: ${{ always() && needs.canonical-heldout.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install summary dependencies
        run: python -m pip install -e ".[numba]"
      - name: Download all eight matrix artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: heldout-pcc-*
          merge-multiple: true
          path: heldout-results
      - name: Validate full cohort and produce prespecified report
        run: |
          python -m experiments.summarize_heldout_p10_vs_potential \
            --files heldout-results/heldout-pcc-*.csv \
            --output heldout-p10-vs-potential-report.md
      - name: Preserve descriptive report
        uses: actions/upload-artifact@v4
        with:
          name: heldout-p10-vs-potential-summary
          path: heldout-p10-vs-potential-report.md
          if-no-files-found: error
