name: Experimental PCC canonical 100k stopping validation

on:
  pull_request:
    paths:
      - 'experiments/audit_canonical_undirected_long_stopping.py'
      - '.github/workflows/canonical-undirected-long-stopping.yml'
  workflow_dispatch:

jobs:
  canonical-long-stop:
    strategy:
      fail-fast: false
      matrix:
        dataset: [iris, wine, breast_cancer, digits]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy scikit-learn numba
      - name: Compare three fixed label-stop patience settings versus 100k
        run: |
          python -m experiments.audit_canonical_undirected_long_stopping \
            --dataset ${{ matrix.dataset }} \
            --seeds 2609 2707 2801 2903 \
            --patience 3 6 10 \
            --cap 100000 \
            --interval 1000 \
            --output canonical-100k-stopping-${{ matrix.dataset }}.csv
      - name: Upload 100k stopping audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-100k-stopping-${{ matrix.dataset }}
          path: canonical-100k-stopping-${{ matrix.dataset }}.csv
          if-no-files-found: error
