name: Cython finite boundary benchmark
on:
  pull_request:
    paths:
      - benchmarks/finite_boundary.py
      - .github/workflows/finite-boundary.yml
  workflow_dispatch:
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy cython scipy scikit-learn setuptools wheel
      - name: Benchmark finite validation crossover
        run: python benchmarks/finite_boundary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-boundary-${{ matrix.os }}
          path: finite-boundary-result.json
          if-no-files-found: warn
