name: Cython fused dominance maximum A/B
on:
  pull_request:
    paths:
      - 'pcc_step.pyx'
      - 'benchmarks/fused_dominance_max_ab.py'
      - '.github/workflows/cython-fused-dominance-max.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy cython setuptools
      - run: python setup.py build_ext --inplace
      - run: python benchmarks/fused_dominance_max_ab.py > fused-dominance-max-results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: fused-dominance-max-${{ matrix.os }}
          path: fused-dominance-max-results.jsonl
