name: Research P1 original-MATLAB source + offline fixture-quality audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/current_p1_original_matlab_exposure_audit_2026-11-12.json'
      - 'docs/current_p1_offline_data_and_matlab_exposure_2026-11-12.md'
      - 'experiments/p1_original_matlab_exposure.py'
      - 'experiments/p1_offline_candidate_integrity.py'
      - 'experiments/test_p1_offline_candidate_integrity.py'
      - '.github/workflows/research-p1-offline-fixture-source-audit.yml'

jobs:
  no-fit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only synthetic XLSX reader dependency
        run: python -m pip install "openpyxl==3.1.5" "numpy==1.26.4"
      - name: Run synthetic local ARFF/XLSX/ZIP quality tests (NO real data, NO fits)
        run: python -m unittest experiments.test_p1_offline_candidate_integrity -v
      - name: Read original MATLAB exact pinned Git commit (NO checkout/data inspection)
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout --depth=1 --branch master https://github.com/fbreve/Particle-Competition-and-Cooperation.git .original-matlab-sources
          git -C .original-matlab-sources rev-parse HEAD
      - name: Verify original tracked source SHA and candidate-name search
        run: python -m experiments.p1_original_matlab_exposure --matlab-repo .original-matlab-sources --output original-matlab-tracked-text-audit.json
      - name: Check no scientific or execution authorization implied
        shell: bash
        run: |
          python -c "import json; r=json.load(open('original-matlab-tracked-text-audit.json')); assert r['candidate_literal_hits_in_checked_sources']==0; assert r['checked_text_files']==12; assert not r['novelty_approved']; assert not r['execution_authorized']; assert r['P1_selected_dataset_ids']==[]; assert r['model_fits_executed']==0"
      - name: Save tracked-source-only research report
        uses: actions/upload-artifact@v4
        with:
          name: P1-MATLAB-SOURCE-NO-FITS-${{ runner.os }}-py${{ matrix.python-version }}
          path: original-matlab-tracked-text-audit.json
          if-no-files-found: error
