name: Experimental PCC in-loop hybrid generalization

on:
  pull_request:
    paths:
      - 'experiments/benchmark_inloop_global_stopping.py'
      - 'experiments/pcc_numpy_dominance_candidate.py'
      - '.github/workflows/inloop-hybrid-generalization.yml'
  workflow_dispatch:

jobs:
  inloop-hybrid-generalization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy scikit-learn numba
      - name: Prospective hybrid stopping on Wine and Digits
        run: |
          python -m experiments.benchmark_inloop_global_stopping \
            --output inloop-hybrid-generalization.csv \
            --datasets wine digits \
            --seeds 11 23 37 \
            --cap 50000 \
            --intervals 1000 \
            --patience 1 2 \
            --criteria label_change dominance_label_hybrid \
            --tolerances 0.01
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inloop-hybrid-generalization
          path: inloop-hybrid-generalization.csv
          if-no-files-found: error
