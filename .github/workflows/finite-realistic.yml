name: Cython realistic particle benchmark
on:
  pull_request:
    paths:
      - benchmarks/finite_realistic.py
      - .github/workflows/finite-realistic.yml
  workflow_dispatch:
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy cython scipy scikit-learn setuptools wheel
      - name: Benchmark full PCC propagation
        run: python benchmarks/finite_realistic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-realistic-${{ matrix.os }}
          path: finite-realistic-result.json
          if-no-files-found: warn
