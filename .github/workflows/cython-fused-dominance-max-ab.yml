name: Cython fused dominance max A/B
on:
  pull_request:
    paths:
      - 'pcc_step.pyx'
      - 'benchmarks/fused_dominance_max_ab.py'
      - '.github/workflows/cython-fused-dominance-max-ab.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        trial: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy cython setuptools
      - run: python -c "import platform,sysconfig,Cython; print('BUILD_ENV', platform.platform(), 'python_compiler=', platform.python_compiler(), 'CC=', sysconfig.get_config_var('CC'), 'Cython=', Cython.__version__)"
      - run: python setup.py build_ext --inplace
      - run: python benchmarks/fused_dominance_max_ab.py > fused-max-results.jsonl
      - run: python -c "from pathlib import Path; print(next(x for x in Path('fused-max-results.jsonl').read_text().splitlines() if x.startswith('SUMMARY ')))"
      - uses: actions/upload-artifact@v4
        with:
          name: fused-max-${{ matrix.os }}-trial-${{ matrix.trial }}
          path: fused-max-results.jsonl
