name: Experimental PCC late-horizon trajectory

on:
  pull_request:
    paths:
      - 'experiments/trace_long_horizon_drift.py'
      - 'experiments/benchmark_inloop_global_stopping.py'
      - 'experiments/pcc_numpy_dominance_candidate.py'
      - '.github/workflows/late-horizon-trajectory.yml'
  workflow_dispatch:

jobs:
  late-horizon-trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy scikit-learn numba
      - name: Trace uninterrupted 100k trajectories at 5k intervals
        run: |
          python -m experiments.trace_long_horizon_drift \
            --checkpoints-output late-horizon-checkpoints.csv \
            --summary-output late-horizon-summary.csv \
            --cases wine:37 wine:67 wine:83 iris:11 iris:37 \
            --interval 5000 \
            --short-cap 50000 \
            --long-cap 100000
      - name: Upload trajectory diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: late-horizon-trajectory
          path: |
            late-horizon-checkpoints.csv
            late-horizon-summary.csv
          if-no-files-found: error
