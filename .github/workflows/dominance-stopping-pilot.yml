name: Experimental dominance stopping real-data pilot

on:
  pull_request:
    paths:
      - 'experiments/compare_dominance_stopping.py'
      - 'experiments/pcc_numpy_dominance_candidate.py'
      - '.github/workflows/dominance-stopping-pilot.yml'
  workflow_dispatch:

jobs:
  real-data-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy scikit-learn numba
      - name: Run capped real-dataset pilot
        run: |
          for tolerance in 0.01 0.05 0.1; do
            python -m experiments.compare_dominance_stopping \
              --output "dominance-stopping-${tolerance}.csv" \
              --datasets iris wine breast_cancer digits \
              --seeds 11 23 37 41 53 \
              --cap 10000 \
              --es-chk 50 \
              --tolerance "$tolerance"
          done
      - name: Upload per-run measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dominance-stopping-pilot
          path: dominance-stopping-*.csv
          if-no-files-found: warn
