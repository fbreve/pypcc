name: Experimental PCC canonical production-stop baseline

on:
  pull_request:
    paths:
      - 'experiments/audit_canonical_production_stop_baseline.py'
      - '.github/workflows/canonical-production-stop-baseline.yml'
  workflow_dispatch:

jobs:
  canonical-existing-stop:
    strategy:
      fail-fast: false
      matrix:
        dataset: [iris, wine, breast_cancer, digits]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy scikit-learn numba
      - name: Compare current potential stop and label stability on undirected kNN
        run: |
          python -m experiments.audit_canonical_production_stop_baseline \
            --dataset ${{ matrix.dataset }} \
            --seeds 3407 3511 3607 \
            --cap 100000 \
            --output canonical-existing-stop-${{ matrix.dataset }}.csv
      - name: Upload current-default stopping comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-existing-stop-${{ matrix.dataset }}
          path: canonical-existing-stop-${{ matrix.dataset }}.csv
          if-no-files-found: error
