name: Experimental inverse class label CPU and native parity

on:
  push:
    branches: [experiment/inverse-label-mapping-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-versus-candidate:
    name: Inverse label exact native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native PCC NumPy, Cython, Numba
        run: python -m pip install -e ".[numba]"
      - name: Require all three native backends
        run: python -c "import pcc_numpy, pcc_numba, pcc_step; print('Native backends available')"
      - name: Actual original/candidate decode blocks and native complete PCC
        run: python experiments/audit_inverse_label_mapping.py
      - uses: actions/upload-artifact@v4
        with:
          name: inverse-label-${{ matrix.os }}
          path: inverse_label_result.json
          if-no-files-found: error

  mandatory-two-os-aggregate:
    name: Full inverse mapping evidence and prospective decision
    needs: original-versus-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: inverse-label-*
          path: reports
          merge-multiple: false
      - name: Require all matched state and speed data on both OS
        run: python experiments/summarize_inverse_label_mapping.py reports
      - uses: actions/upload-artifact@v4
        with:
          name: inverse-label-decision
          path: inverse_label_summary.json
          if-no-files-found: error
