name: Cython fused max compiler diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/cython-fused-max-compiler-diagnostics.yml'
  workflow_dispatch:
jobs:
  diagnostics:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy cython setuptools
      - run: python setup.py build_ext --inplace
      - name: Compiler and extension metadata
        shell: python
        run: |
          import platform, sysconfig, pathlib, Cython
          print('PLATFORM', platform.platform())
          print('COMPILER', platform.python_compiler())
          print('CC', sysconfig.get_config_var('CC'))
          print('CYTHON', Cython.__version__)
          print('GENERATED_C', [(str(p), p.stat().st_size) for p in pathlib.Path('.').glob('pcc_step.c')])
      - name: Linux compiler optimization diagnostics
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3-config --includes
          gcc --version | head -1
          gcc -O3 -fopt-info-vec-all=vectorization.txt -S -fverbose-asm $(python3-config --includes) -I"$(python -c 'import numpy; print(numpy.get_include())')" pcc_step.c -o pcc_step_linux.s 2>compiler-stderr.txt || true
          test -s pcc_step_linux.s
          grep -E 'optimized:|missed:' vectorization.txt | head -100 || true
      - name: Windows compiler optimization diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonInclude = python -c "import sysconfig; print(sysconfig.get_path('include'))"
          $numpyInclude = python -c "import numpy; print(numpy.get_include())"
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if ($cl) {
            & cl.exe /nologo /O2 /c /FAcs /Fa:pcc_step_windows.asm "/I$pythonInclude" "/I$numpyInclude" pcc_step.c 2>&1 | Tee-Object -FilePath compiler-output.txt
          } else {
            'cl.exe not on PATH; generated C is still available for inspection' | Tee-Object -FilePath compiler-output.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-diagnostics-${{ matrix.os }}
          path: |
            pcc_step.c
            pcc_step_linux.s
            pcc_step_windows.asm
            vectorization.txt
            compiler-stderr.txt
            compiler-output.txt
          if-no-files-found: warn
