name: "Research: synthetic NumPy live full-fit CPU paired pilot"
on:
  push:
    branches: [research/current-numpy-live-milestones-2026-11-11]
    paths:
      - experiments/live_numpy_milestones.py
      - experiments/bench_live_numpy_fullfit.py
      - .github/workflows/research-numpy-live-fullfit-cpu.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured-full-fit:
    name: "synthetic full-fit CPU (${{ matrix.os }}, Python 3.12)"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native PyPCC plus optional NumPy/Numba dependencies
        run: python -m pip install -e ".[numba]"
      - name: Compile and check synthetic benchmark code
        run: python -m py_compile experiments/live_numpy_milestones.py experiments/bench_live_numpy_fullfit.py
      - name: AB/BA paired complete fit_predict CPU, synthetic fixture only
        run: python -m experiments.bench_live_numpy_fullfit --nodes 200 --iterations 1200 --repeats 3 --output cpu_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "numpy-live-fullfit-cpu-${{ matrix.os }}"
          retention-days: 90
          if-no-files-found: warn
          path: cpu_report.json
