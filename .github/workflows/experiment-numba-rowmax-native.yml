name: Experimental exact native Numba rowmax CPU cache

on:
  push:
    branches: [experiment/numba-rowmax-native-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-and-cached-numba:
    name: Frozen source Numba rowmax (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current production NumPy Numba Cython dependencies
        run: python -m pip install -e ".[numba]"
      - name: Exact original Git source, Numba cache and complete native CPU trial
        run: python -m experiments.audit_numba_rowmax_cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numba-rowmax-${{ matrix.os }}
          path: numba_rowmax_results.json
          if-no-files-found: warn

  independent-strict-source-and-parity:
    name: Full original vs Numba cached CPU and state decision
    needs: original-and-cached-numba
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: numba-rowmax-*
          path: evidence
          merge-multiple: false
      - name: Enforce 192 exact CPU source pairs, 96 traces, and 3216 potential checks
        run: python -m experiments.summarize_numba_rowmax_cache evidence
      - uses: actions/upload-artifact@v4
        with:
          name: numba-rowmax-scientific-decision
          path: |
            numba_rowmax_report.md
            numba_rowmax_decision.json
          if-no-files-found: error
