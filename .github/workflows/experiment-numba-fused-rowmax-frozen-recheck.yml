name: "Experiment: strict replay of frozen Numba rowmax source artifacts"

on:
  push:
    branches: [experiment/numba-fused-rowmax-corder-heldout-v1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-two-os-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Strict immutable original-host CPU and state recheck"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          repository: fbreve/pypcc
          run-id: 42690241064
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: numba-fused-rowmax-native-raw-*
          path: .cache/frozen-original-numba-rowmax
          merge-multiple: false
      - name: Recheck original SHA40 and SHA256 and all frozen native CPU pairs
        run: >-
          python -m experiments.summarize_numba_fused_rowmax
          .cache/frozen-original-numba-rowmax
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numba-fused-rowmax-frozen-strict-decision
          path: |
            numba_fused_rowmax_report.md
            numba_fused_rowmax_decision.json
          if-no-files-found: error
          retention-days: 90
